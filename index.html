<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mObywatel</title>
    
    <!-- Konfiguracja ikony i pełnego ekranu dla iPhone / Android -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Styl dopasowujący film i ekran powitalny do pełnego ekranu */
        video, .splash-screen {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background-color: #f4f5f7;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Ekran startowy (screen) na samej górze */
        .splash-screen {
            z-index: 1000;
            transition: opacity 0.5s ease; /* Płynne znikanie screenu */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Dyskretny przycisk w prawym dolnym rogu */
        .control-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(128, 128, 128, 0.15);
            border: 1px solid rgba(128, 128, 128, 0.2);
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            opacity: 1;
        }
        .control-btn::after {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: rgba(128, 128, 128, 0.3);
            border-radius: 1px;
        }
        .control-btn.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Ekran startowy ze zrzutem ekranu o nazwie poczatek.png -->
    <div class="splash-screen" id="splash">
        <img src="poczatek.png" alt="Ekran początkowy">
    </div>

    <!-- Odtwarzacz wideo pod spodem -->
    <video loop muted playsinline id="myVideo">
        <source src="film.mp4" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzacza wideo.
    </video>

    <!-- Przycisk sterujący ukryty w rogu -->
    <div class="control-btn" id="playPauseBtn" onclick="togglePlayPause()"></div>

    <script>
        let video = document.getElementById('myVideo');
        let btn = document.getElementById('playPauseBtn');
        let splash = document.getElementById('splash');

        // Odliczanie 2 sekund przed ukryciem screenu i startem filmu
        setTimeout(() => {
            splash.style.opacity = '0'; // Płynne ściemnianie obrazka
            setTimeout(() => {
                splash.style.display = 'none'; // Całkowite usunięcie warstwy z widoku
                video.play().catch(function(error) {
                    // Jeśli przeglądarka zablokuje autostart, kliknięcie w dowolne miejsce uruchomi film
                    document.body.addEventListener('click', () => {
                        video.play();
                    }, { once: true });
                });
            }, 500); // Czas trwania animacji zanikania
        }, 2000); // Czas wyświetlania pierwszego screenu (2 sekundy)

        function togglePlayPause() {
            if (video.paused) {
                video.play();
                btn.classList.remove('hidden');
            } else {
                video.pause();
                btn.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
